# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Allow terminal-native mouse selection
set -g mouse on

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style "fg=#334155"
set -g pane-active-border-style "fg=#60a5fa"

# statusbar
set -g status-position bottom
set -g status-justify left

set -g status-style 'fg=#ffffff'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=#ffffff, bg=#334155, bold'
set -g status-right ' %Y-%m-%d %H:%M '
set -g status-right-length 50

set -g window-status-current-style "bg=#334155,fg=#ffffff,bold"

setw -g window-status-current-format ' #I #W #F '

set -g window-status-style "bg=#1e293b,fg=#94a3b8"

setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=#ffffff, bg=#334155,bold'
